# Netlify Configuration for CNERG Mind Website

[build]
  # Command to run before deployment
  command = "npm install"

  # Directory to deploy
  publish = "."

  # Directory containing functions
  functions = "netlify/functions"

# Environment variables (set in Netlify → Site configuration → Environment variables,
# then trigger a redeploy so the email function picks them up):
#   SENDGRID_API_KEY    required
#   ENQUIRY_TO_EMAIL    optional, defaults to sales@cnergmind.com
#   ENQUIRY_FROM_EMAIL  optional, defaults to noreply@cnergmind.com (must be verified in SendGrid)

# Redirect rules
[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
